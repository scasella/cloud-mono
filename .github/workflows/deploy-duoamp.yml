name: Deploy DuoAmp to GitHub Pages

# Manual for now, so half-finished work on the branch is never published.
# Run it from the Actions tab (or add a push trigger once things settle).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/duoamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/duoamp/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Spotify Client ID baked into the build. It is a public identifier, not a secret
          # (it appears in every sign-in URL). Override with the repository variable
          # SPOTIFY_CLIENT_ID; without either, the app asks for it in its connect screen.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID || '08fba930e158461686a63dc88074d011' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/duoamp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
